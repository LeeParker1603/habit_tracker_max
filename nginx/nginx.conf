upstream django_app {
    server web:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Добавляем автоматический слеш в конец всех запросов к /api/
    location /api/ {
        # Если в конце пути нет точки (не файл) и нет слеша — дописываем слеш
        rewrite ^([^.]*[^/])$ $1/ break;

        proxy_pass http://django_app;
        proxy_set_header Content-Type "application/json";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Восстанавливаем слеш для админки Django
    location /admin {
        rewrite ^([^.]*[^/])$ $1/ break;

        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}